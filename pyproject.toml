[project]
name = "tiktokdownloader"
version = "0.1.0"
description = "Nix flake update diff checker. Useful for validating and diffing flakes after updates. Short for fl(ake) up(date) d(iff)."
authors = [{ name = "Alice Huston", email = "aliceghuston@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
    "attrs==24.2.0",
    "beautifulsoup4==4.12.3",
    "bs4==0.0.2",
    "certifi==2024.8.30",
    "cffi==1.17.1",
    "charset-normalizer==3.4.0",
    "fake-useragent==2.0.3",
    "h11==0.14.0",
    "idna==3.10",
    "lz4==4.3.3",
    "more-itertools==10.6.0",
    "outcome==1.3.0.post0",
    "packaging==24.2",
    "pycparser==2.22",
    "pycryptodomex==3.21.0",
    "pysocks==1.7.1",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "ruamel-yaml==0.18.6",
    "selenium==4.27.1",
    "sniffio==1.3.1",
    "sortedcontainers==2.4.0",
    "soupsieve==2.6",
    "tikapi==3.2.0",
    "tiktokapi==6.5.2",
    "tiktok-captcha-solver==0.7.4",
    "trio==0.27.0",
    "trio-websocket==0.11.1",
    "typing-extensions==4.12.2",
    "urllib3==2.2.3",
    "webdriver-manager==4.0.2",
    "websocket-client==1.8.0",
    "wsproto==1.2.0",
    "yt-dlp==2024.12.3",
]


[project.scripts]
collections = "tiktokdownloader.collection_extract:main"
following = "tiktokdownloader.following_extract:main"
# flake-update-diff = "flupdt.main:main"

[dependency-groups]
dev = ["ruff>=0.8.6"]

[tool.hatch.build.targets.sdist]
include = ["tiktokdownloader"]

[tool.hatch.build.targets.wheel]
include = ["tiktokdownloader"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]

line-length = 100
indent-width = 4

target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "G004",   # (perm) this is a performance nit
    "COM812",  # https://docs.astral.sh/ruff/rules/missing-trailing-comma/
    "ISC001",  # https://docs.astral.sh/ruff/rules/single-line-implicit-string-concatenation/
]

[tool.ruff.lint.per-file-ignores]

"tests/**" = [
    "S101", # (perm) pytest needs asserts
]

fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.pylint]
max-args = 9
